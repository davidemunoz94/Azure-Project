apiVersion: v1
kind: Pod
metadata:
  name: lab2-client
  namespace: k8s-lab2
  labels:
    learning.codex/lab: k8s-lab2
    app: lab2-client
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: client
    image: docker.io/library/python:3.13-slim-bookworm@sha256:281d39ff02e3b389401586134ff9e6572954687822a58055ec07a60ded4e0b7f
    imagePullPolicy: IfNotPresent
    command: [python, -B, -u, -c, "import time; time.sleep(86400)"]
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 100m, memory: 64Mi}
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
